spring.application.name=campaign-manager-api

# In-memory H2 database (data resets on restart)
spring.datasource.url=jdbc:h2:mem:campaigns
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Gemini settings. The key is read from the GEMINI_API_KEY environment variable,
# so no secret is ever committed. AI generation is disabled when it is not set.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
